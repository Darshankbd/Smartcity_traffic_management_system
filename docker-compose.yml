version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: smart_city_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  web:
    build: .
    container_name: smart_city_web
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
    depends_on:
      - mongodb

volumes:
  mongo_data:
